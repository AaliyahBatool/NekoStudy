name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: neko
          POSTGRES_DB: nekostudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko -d nekostudy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://neko:neko@localhost:5432/nekostudy_test
      REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nekostudy/shared build

      - name: Generate Prisma client
        run: pnpm --filter @nekostudy/api exec prisma generate

      - name: Deploy database migrations
        run: pnpm --filter @nekostudy/api exec prisma migrate deploy

      - name: Create test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=4001
          CLIENT_ORIGIN=http://localhost:5173
          DATABASE_URL=postgresql://neko:neko@localhost:5432/nekostudy_test
          REDIS_URL=redis://localhost:6379/1
          JWT_SECRET=test-only-jwt-secret-at-least-32-characters
          COOKIE_SECRET=test-only-cookie-secret-at-least-32-chars
          ASSET_BASE_URL=http://localhost:4001/assets
          EOF

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
